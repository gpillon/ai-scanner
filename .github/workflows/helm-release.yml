name: Helm chart

# Lints the chart on every change to it, and publishes it on every release tag (`vX.Y.Z`, see
# `make release`) as a Helm repository on GitHub Pages:
#   helm repo add ai-scanner https://<owner>.github.io/<repo>
#
# The repository is incremental. The gh-pages branch archives every package released, and the
# index.yaml listing them all. Each release adds its package there and merges its entry into
# that index, then deploys the whole archive to Pages. A version already published is never
# overwritten. The branch is created on the first release.
#
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/helm-release.yml
  pull_request:
    paths:
      - charts/**
      - .github/workflows/helm-release.yml
  workflow_dispatch:

concurrency:
  # One publication at a time: each one rewrites gh-pages' index.yaml.
  group: helm-${{ startsWith(github.ref, 'refs/tags/') && 'publish' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HELM_VERSION: v3.16.4

jobs:
  lint:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint
        run: helm lint --strict charts/ai-scanner

      # Both flavours: vanilla Kubernetes gets an Ingress, OpenShift (detected from its APIs) a Route.
      - name: Render
        run: |
          helm template t charts/ai-scanner --set expose.enabled=true --set expose.host=scanner.example.com > /tmp/kubernetes.yaml
          helm template t charts/ai-scanner --set expose.enabled=true \
            --api-versions security.openshift.io/v1 --api-versions route.openshift.io/v1 > /tmp/openshift.yaml
          grep -q '^kind: Ingress' /tmp/kubernetes.yaml && ! grep -q '^kind: Route' /tmp/kubernetes.yaml
          grep -q '^kind: Route' /tmp/openshift.yaml && ! grep -q '^kind: Ingress' /tmp/openshift.yaml
          ! grep -q 'runAsUser' /tmp/openshift.yaml

      - name: Validate against the Kubernetes schemas
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/kubernetes.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 -skip Route /tmp/openshift.yaml

  publish:
    name: Publish to GitHub Pages
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # The chart, its appVersion and the images CI pushes for this tag all carry the same version.
      - name: Check the version
        id: version
        run: |
          version="${TAG#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          chart=$(sed -n 's/^version: *//p' charts/ai-scanner/Chart.yaml | tr -d '"')
          app=$(sed -n 's/^appVersion: *//p' charts/ai-scanner/Chart.yaml | tr -d '"')
          if [ "$chart" != "$version" ] || [ "$app" != "$version" ]; then
            echo "::error::Chart.yaml has version $chart and appVersion $app, but the tag is $TAG: release with 'make release VERSION=$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: helm package charts/ai-scanner --destination dist-chart

      # The archive of every release: the gh-pages branch, created empty on the first release.
      - name: Check out the archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" pages
          else
            git init --quiet -b gh-pages pages
            git -C pages remote add origin "$remote"
          fi

      # Adds this version next to the earlier ones and merges its entry into the existing index.
      - name: Add this version
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          url="https://${owner}.github.io/${{ github.event.repository.name }}"
          pkg="ai-scanner-${{ steps.version.outputs.version }}.tgz"
          mkdir -p pages/charts
          if [ -e "pages/charts/$pkg" ]; then
            echo "::error::$pkg is already published: a release is never overwritten"
            exit 1
          fi
          cp "dist-chart/$pkg" pages/charts/
          merge=""
          [ -f pages/index.yaml ] && merge="--merge pages/index.yaml"
          helm repo index dist-chart --url "$url/charts" $merge
          cp dist-chart/index.yaml pages/index.yaml
          touch pages/.nojekyll
          git -C pages add charts index.yaml .nojekyll
          git -C pages commit --quiet -m "Publish the ai-scanner chart ${{ steps.version.outputs.version }}"
          git -C pages push --quiet origin gh-pages
          echo "Versions in the index: $(grep -c '^    version:' pages/index.yaml)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Attach the chart to the GitHub release
        run: |
          pkg="dist-chart/ai-scanner-${{ steps.version.outputs.version }}.tgz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$pkg" --clobber
          else
            gh release create "$TAG" "$pkg" --verify-tag --generate-notes --title "$TAG"
          fi
