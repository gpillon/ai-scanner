name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix ui

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck --prefix ui

      # The Podman smoke tests stay skipped: they need SCANNER_SMOKE=1, Podman and a model.
      - name: Test
        run: npm test

      - name: Build
        run: |
          npm run build
          npm run build --prefix ui

  image:
    name: Build ${{ matrix.name }} image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The service: API plus web UI.
          - name: ai-scanner
            context: .
            file: Containerfile
          # What the Podman Runner starts for each Attempt (SCANNER_AGENT_IMAGE).
          - name: ai-scanner-agent
            context: containers/agent
            file: containers/agent/Containerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Pull requests build the image to prove it builds, and push nothing.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The agent image's `full` variant (ADR-0016), layered on the agent image this run pushed, by
  # its commit tag, so both carry the same opencode. Its tags follow the agent image's.
  agent-full-image:
    name: Build ai-scanner-agent-full image
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Pull requests push nothing, so there is no agent image to start from: build both here,
      # to prove they build.
      - name: Build on the agent image (pull request)
        if: github.event_name == 'pull_request'
        run: |
          docker build -t ai-scanner-agent:pr containers/agent
          docker build --build-arg BASE_IMAGE=ai-scanner-agent:pr -t ai-scanner-agent-full:pr containers/agent-full

      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: name
        if: github.event_name != 'pull_request'
        run: |
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=$owner/ai-scanner-agent-full" >> "$GITHUB_OUTPUT"
          # The `type=sha` tag the image job gave the agent image.
          echo "base=$owner/ai-scanner-agent:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: containers/agent-full
          file: containers/agent-full/Containerfile
          build-args: BASE_IMAGE=${{ steps.name.outputs.base }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-scanner-agent-full
          cache-to: type=gha,mode=max,scope=ai-scanner-agent-full
