{{- if not .Values.auth.existingSecret }}
{{- /* Random tokens on install, kept on upgrade: regenerating them would lock clients out and lose the stored keys. */}}
{{- $name := include "ai-scanner.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-scanner.labels" . | nindent 4 }}
type: Opaque
data:
  SCANNER_TOKEN: {{ $existing.SCANNER_TOKEN | default (randAlphaNum 40 | b64enc) }}
  {{- if .Values.auth.admin }}
  SCANNER_ADMIN_TOKEN: {{ $existing.SCANNER_ADMIN_TOKEN | default (randAlphaNum 40 | b64enc) }}
  {{- end }}
  # Encrypts the Provider API keys stored in the database: losing it loses those keys.
  SCANNER_SECRET_KEY: {{ $existing.SCANNER_SECRET_KEY | default (randAlphaNum 48 | b64enc) }}
{{- end }}
