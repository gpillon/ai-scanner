{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-scanner.serviceAccountName" . }}
  labels:
    {{- include "ai-scanner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if .Values.agent.serviceAccount.create }}
# Agent pods run as this account: it has no permission, and its token is never mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-scanner.agentServiceAccountName" . }}
  labels:
    {{- include "ai-scanner.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
# What the Kubernetes Runner does, in the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ai-scanner.fullname" . }}
  labels:
    {{- include "ai-scanner.labels" . | nindent 4 }}
rules:
  # Agent pods: one per Attempt; and the server's own pod, to discover its setup.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # A Secret per Attempt for the model key, owned by its pod.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, delete, patch]
  # Discovery: the Service exposing the egress proxy, and the data claim's access mode.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ai-scanner.fullname" . }}
  labels:
    {{- include "ai-scanner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ai-scanner.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-scanner.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
