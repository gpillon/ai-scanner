{{- if .Values.networkPolicy.enabled }}
# Agent pods run code-reading agents on untrusted Source Archives (ADR-0003, ADR-0007). The chart
# denies them everything, DNS included. For each Attempt the server adds two NetworkPolicies:
# its agent may reach its own egress proxy pod, and only its agent may reach that proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-scanner.fullname" . }}-agent
  labels:
    {{- include "ai-scanner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-scanner.agentSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
# Each Attempt's egress proxy: nothing reaches it but its own agent (allowed per Attempt). Its
# egress stays open, to reach the model endpoint it lets through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-scanner.fullname" . }}-egress-proxy
  labels:
    {{- include "ai-scanner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-scanner.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: egress-proxy
  policyTypes: [Ingress]
  ingress: []
{{- with .Values.networkPolicy.apiIngressFrom }}
---
# The API port, to the sources allowed (by default the server takes ingress from anywhere).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-scanner.fullname" . }}-server
  labels:
    {{- include "ai-scanner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-scanner.serverSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 3000
          protocol: TCP
{{- end }}
{{- end }}
